  <script>
    (function () {
      const byId = (name) => document.getElementById("scene-01-invitation-" + name);
      const content = [
        { body: "Your next keyboard.", hold: 0.78 },
        { body: "Starts here.", hold: 0.69 },
        { body: "A studio for your next build.", hold: 1.38 }
      ];
      let cumulative = 0;
      const phases = content.map((entry) => {
        const start = cumulative;
        cumulative += 0.45 + entry.body.length * 0.03 + entry.hold;
        return { start, end: cumulative };
      });
      const tl = gsap.timeline({ paused: true });
      const camera = byId("camera");
      const phase = { scale: 1.085 };
      const drift = { p: 0 };
      const renderCamera = () => {
        const dx = Math.sin(drift.p) * 3;
        const dy = Math.sin(drift.p * 1.3) * 1.5;
        camera.style.transform = `scale(${phase.scale}) translate(${dx}px, ${dy}px)`;
      };
      renderCamera();

      tl.to(phase, { scale: 1.045, duration: phases[0].end, ease: "power2.out" }, 0);
      tl.to(phase, { scale: 1, duration: phases[1].end - phases[1].start, ease: "power3.out" }, phases[1].start);
      tl.to(phase, { scale: 1.025, duration: phases[2].end - phases[2].start, ease: "power2.inOut" }, phases[2].start);
      tl.to(drift, {
        p: Math.PI * 2,
        duration: 6,
        ease: "none",
        onUpdate: renderCamera
      }, 0);

      tl.fromTo(byId("hero"), { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, phases[1].start + 0.12);
      tl.to(byId("shade"), { opacity: 0, duration: 0.001, ease: "none" }, phases[1].start + 0.12);
      tl.fromTo(byId("image-cut"), { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.in" }, phases[1].start);
      tl.to(byId("image-cut"), { opacity: 0, duration: 0.12, ease: "power2.out" }, phases[1].start + 0.121);

      tl.fromTo(byId("wordmark"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.05);
      tl.fromTo([byId("line-one"), byId("line-two")],
        { opacity: 0, x: -36, y: 18, filter: "blur(6px)" },
        { opacity: 1, x: 0, y: 0, filter: "blur(0px)", duration: 0.8, stagger: 0.14, ease: "power3.out" },
        0.16
      );
      tl.fromTo(byId("line-three"),
        { opacity: 0, x: -36, y: 18, filter: "blur(6px)" },
        { opacity: 1, x: 0, y: 0, filter: "blur(0px)", duration: 0.8, ease: "power3.out" },
        phases[1].start + 0.6
      );
