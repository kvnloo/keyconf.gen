  <script>
    (() => {
      const el = (name) => document.getElementById("scene-06-start-" + name);

      const content = [

        { title: "Start building", hold: 0.65, minimum: 1.8 },
        { title: "keyconf", hold: 1.65, minimum: 2.4 },

      let elapsed = 0;
      const beats = content.map((item) => {
        const duration = Math.max(item.minimum, 0.5 + item.title.length * 0.035 + item.hold);
        const start = elapsed;
        elapsed += duration;
        return { start, end: elapsed };
      });
      const phase = { scale: 0.988 };
      const drift = { progress: 0 };
      const camera = el("camera");

      timeline.to(phase, { scale: 0.994, duration: 0.48, ease: "power2.out" }, 0);

      timeline.to(drift, {
        progress: Math.PI * 2,
        duration: 6,
        ease: "none",
        onUpdate: () => {
          const dx = Math.sin(drift.progress) * 2;
          const dy = Math.sin(drift.progress * 1.3);
          camera.style.transform = `scale(${phase.scale}) translate(${dx}px, ${dy}px)`;
        },
      }, 0);

      timeline.fromTo(el("wordmark"), { opacity: 0 }, { opacity: 1, duration: 0.34, ease: "power2.out" }, 0);
      timeline.fromTo(el("headline"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.62, ease: "power3.out" }, 0.5);
