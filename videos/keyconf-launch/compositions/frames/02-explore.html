  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="scene-02-explore"]');
      const element = (name) => root.querySelector('[id="scene-02-explore-' + name + '"]');
      const content = [
        { element: element("forest"), title: "Forest Line", hold: 0.87 },
        { element: element("blush"), title: "Blush", hold: 0.65 },
        { element: element("midnight"), title: "Midnight", hold: 1.96 },
      ];
      let elapsed = 0;
      const phases = content.map((entry) => {
        const duration = 0.6 + entry.title.length * 0.03 + entry.hold;
        const start = elapsed;
        elapsed = Math.round((elapsed + duration) * 1000) / 1000;
        return { ...entry, start, end: elapsed };
      });

      const timeline = gsap.timeline({ paused: true });
      timeline.to({ time: 0 }, { time: 6, duration: 6, ease: "none" }, 0);
      timeline.fromTo(element("topbar"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 0);
      timeline.fromTo(element("headline"), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0.05);

      phases.forEach((phase, index) => {
        if (index === 0) return;
        timeline.fromTo(phase.element, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.inOut" }, phase.start);
        timeline.to(phases[index - 1].element, { opacity: 0, duration: 0.18, ease: "power2.inOut" }, phase.start);
      });

      timeline.fromTo(element("support"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, phases[2].start + 1.1);
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-02-explore"] = timeline;
    })();
